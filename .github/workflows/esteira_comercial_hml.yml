name: Esteira comercial (branch hml)

on:
  workflow_dispatch:
  push:
    branches: [hml]
    paths:
      - "databricks.yml"
      - "resources/pipeline_comercial.yml"
      - "projeto_aluno_databricks/notebooks/custom/**/*.py"
      - ".github/workflows/esteira_comercial_hml.yml"

permissions:
  contents: read

jobs:
  esteira-comercial:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: "1. Validar definicao da esteira"
        id: validate_bundle
        run: databricks bundle validate -t dev

      - name: "2. Criar ou atualizar Job comercial"
        id: deploy_bundle
        run: databricks bundle deploy -t dev

      - name: "3. Validar Job publicado e mostrar link"
        id: verify_deployment
        run: databricks bundle summary -t dev

      - name: "4. Executar esteira comercial por etapas"
        id: run_pipeline
        run: databricks bundle run pipeline_comercial -t dev

      - name: "5. Resumo visual da execucao"
        if: always()
        env:
          VALIDATE_RESULT: ${{ steps.validate_bundle.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy_bundle.outcome }}
          VERIFY_RESULT: ${{ steps.verify_deployment.outcome }}
          RUN_RESULT: ${{ steps.run_pipeline.outcome }}
        run: |
          {
            echo "## Resultado da esteira comercial"
            echo
            echo "| Fase | Resultado |"
            echo "| --- | --- |"
            echo "| Validar definicao | $VALIDATE_RESULT |"
            echo "| Criar/atualizar Job | $DEPLOY_RESULT |"
            echo "| Validar Job publicado | $VERIFY_RESULT |"
            echo "| Executar tasks Databricks | $RUN_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RUN_RESULT" = "success"